<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RealHealth · Logging</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1D3AC7;
    background-image: radial-gradient(circle at 15% 0%, rgba(29,143,219,0.35) 0%, transparent 45%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card { text-align: center; max-width: 340px; }
  .spinner {
    width: 40px; height: 40px; margin: 0 auto 20px;
    border: 3px solid rgba(255,255,255,0.2); border-top-color: #F5C13B;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .check {
    width: 52px; height: 52px; margin: 0 auto 20px;
    border-radius: 50%; background: rgba(79,209,165,0.15);
    display: flex; align-items: center; justify-content: center;
  }
  .check svg { width: 26px; height: 26px; }
  .title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .sub { font-size: 14px; color: rgba(255,255,255,0.65); line-height: 1.5; }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="card">
    <div id="loading">
      <div class="spinner"></div>
      <div class="title">Logging…</div>
      <div class="sub" id="loadingSub">Sending to your dashboard</div>
    </div>
    <div id="done" class="hidden">
      <div class="check">
        <svg viewBox="0 0 24 24" fill="none" stroke="#4FD1A5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="title" id="doneTitle">Logged</div>
      <div class="sub" id="doneSub">RealHealth dashboard updated. You can close this.</div>
    </div>
  </div>

<script>
  /* This page exists because Google's script.google.com endpoint occasionally
     returns a broken/ugly error page even when the underlying write succeeds
     (or on a genuine transient failure). Rather than the person tapping a
     sync-link ever seeing that, this page relays the request quietly and
     always shows a clean, branded confirmation.

     IMPORTANT — food/checkin entries APPEND a new row on every hit. Steps
     UPSERT by date, so re-sending is harmless. To avoid ever double-logging a
     meal, this page only retries when the request never reached Google at
     all (a true network failure) — never after a response of any kind (even
     an error response) was received, since we can't safely tell whether the
     write happened before that error was returned. */

  const ENDPOINT = 'https://script.google.com/macros/s/AKfycbx1DnPyoKzyc-n9WS_j0YtsCq75HbjQTzlFMG9WUKTP8870v8TKDItCuTZaiy1aq2APtw/exec';
  const params = new URLSearchParams(window.location.search);
  const type = params.get('type') || '';
  const meal = params.get('meal');
  const count = params.get('count');

  function friendlyMessage() {
    if (type === 'food') return meal ? 'Meal logged: ' + decodeURIComponent(meal.replace(/\+/g, ' ')) : 'Meal logged';
    if (type === 'checkin') return 'Check-in logged';
    if (type === 'steps') return 'Steps logged' + (count ? ': ' + count : '');
    return 'Logged';
  }

  async function sendOnce() {
    // mode:'no-cors' means we can't read Google's response, but that's fine —
    // we only need the request to actually reach the server and fire the
    // write. A resolved promise (even opaque) means it was sent successfully;
    // only a rejected promise means it never left the browser.
    await fetch(ENDPOINT + window.location.search, { mode: 'no-cors' });
  }

  async function run() {
    let sent = false;
    for (let attempt = 0; attempt < 3 && !sent; attempt++) {
      try {
        await sendOnce();
        sent = true; // reached Google — stop here, never retry past this point
      } catch (err) {
        // true network failure — request never sent, safe to retry
        if (attempt < 2) await new Promise(r => setTimeout(r, 700));
      }
    }
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('done').classList.remove('hidden');
    document.getElementById('doneTitle').textContent = friendlyMessage();
    if (!sent) {
      document.getElementById('doneSub').textContent = 'Could not reach the server — check your connection and try the link again.';
    }
  }

  run();
</script>
</body>
</html>
